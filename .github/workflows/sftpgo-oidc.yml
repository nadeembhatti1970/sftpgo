name: SFTPGo OIDC Terraform checks

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/sftpgo-oidc.yml'
      - 'core-sftpgo-oidc/**'
      - 'requirements.txt'
  pull_request:
    paths:
      - '.github/workflows/sftpgo-oidc.yml'
      - 'core-sftpgo-oidc/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.16.5

jobs:
  oidc-terraform-checks:
    name: SFTPGo OIDC Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-sftpgo-oidc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        working-directory: .
        run: pip install --quiet -r requirements.txt

      - name: Initialize Terraform without remote backend
        run: terraform init -backend=false -test-directory=testing

      - name: Terraform format
        run: terraform fmt -check -recursive -diff

      - name: Terraform validate
        run: terraform validate

      - name: Checkov static scan
        run: checkov -d . --framework terraform --compact --quiet

      - name: Terraform tests
        run: terraform test -test-directory=testing
