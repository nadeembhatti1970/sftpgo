# SFTPGo teardown removes its EKS Pod Identity association, stopping the
# workload's AWS access while preserving the user-file bucket, KMS key, and
# published Helm chart repository. The S3 bucket and KMS key are protected by
# Terraform prevent_destroy and must remain intact across routine teardowns.
name: teardown

on:
  schedule:
    # GitHub cron is UTC: 16:00 UTC = 17:00 BST, 17:00 UTC = 17:00 GMT.
    # The gate job selects the entry matching the current London offset.
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      confirm_teardown:
        description: Type sftpgo to detach SFTPGo from its S3 workload identity
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.16.5

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Run at 17:00 London time
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          run=false
          offset=$(TZ=Europe/London date +%z)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=true
          elif [ "$SCHEDULE" = "0 16 * * *" ] && [ "$offset" = "+0100" ]; then
            run=true
          elif [ "$SCHEDULE" = "0 17 * * *" ] && [ "$offset" = "+0000" ]; then
            run=true
          fi
          echo "London offset ${offset}, event ${EVENT} '${SCHEDULE}', run=${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  teardown:
    name: Detach SFTPGo workload identity
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: sftpgo-lifecycle
      cancel-in-progress: false
    defaults:
      run:
        working-directory: core-sftpgo
    steps:
      - name: Require explicit confirmation
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          CONFIRMATION: ${{ inputs.confirm_teardown }}
        run: |
          if [[ "$CONFIRMATION" != "sftpgo" ]]; then
            echo "::error::Type sftpgo in the confirmation field to run teardown."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::042170206259:role/devops-dev-sftpgo-gha-terraform-apply
          role-session-name: gha-sftpgo-teardown-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Initialize Terraform
        run: terraform init -input=false -test-directory=testing

      - name: Check workload identity state
        id: state
        run: |
          if ! terraform state list | grep -Fxq 'aws_eks_pod_identity_association.sftpgo'; then
            echo "::notice::SFTPGo Pod Identity association is absent; nothing to tear down."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Destroy SFTPGo Pod Identity association
        if: steps.state.outputs.present == 'true'
        run: terraform destroy -input=false -auto-approve -lock-timeout=10m -target=aws_eks_pod_identity_association.sftpgo

