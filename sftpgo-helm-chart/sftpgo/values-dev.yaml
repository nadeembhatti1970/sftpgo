# Deployment overlay for the EKS cluster managed by ../../core-infra.
# The AWS Load Balancer Controller discovers the wildcard ACM certificate from
# the ingress hostname. ACM ARNs stay out of this chart's values.
replicaCount: 1

serviceAccount:
  create: true
  name: sftpgo

persistence:
  enabled: true
  pvc:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
    storageClassName: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "10000"
  prometheus.io/path: /metrics

ui:
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: sftpgo
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      external-dns.alpha.kubernetes.io/hostname: sftpgo.bizopensource.com
    hosts:
      - host: sftpgo.bizopensource.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

api:
  ingress:
    enabled: false

# Publish only the SFTP listener through an internet-facing NLB; the public UI
# ingress remains the separate HTTP entry point.
services:
  sftp-public:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      external-dns.alpha.kubernetes.io/hostname: sftp.bizopensource.com
    ports:
      sftp:
        port: 22
